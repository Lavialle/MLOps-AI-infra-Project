name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked: fails if uv.lock is out of sync with pyproject.toml
      # Python 3.14 is installed by uv from .python-version; torch comes from the CPU index (pyproject.toml)
      - name: Dependencies
        run: uv sync --locked

      # Ruff runs as a standalone tool (uvx): it does not need to be a project dependency
      - name: Lint
        run: |
          uvx ruff@0.17.6 check src tests
          uvx ruff@0.17.6 format --check src tests

      - name: Tests
        run: uv run --no-sync pytest -q

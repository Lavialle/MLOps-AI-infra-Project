name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked: fails if uv.lock is out of sync with pyproject.toml
      # Python 3.14 is installed by uv from .python-version; torch comes from the CPU index (pyproject.toml)
      - name: Dependencies
        run: uv sync --locked

      # Whole repo (src, tests, webapp, loadtest, infra). Same ruff version as .pre-commit-config.yaml
      - name: Lint
        run: |
          uvx ruff@0.17.6 check .
          uvx ruff@0.17.6 format --check .

      - name: Tests
        run: uv run --no-sync pytest -q

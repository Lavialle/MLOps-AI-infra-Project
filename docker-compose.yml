#   docker compose up -d                  # S3 + MLflow
#   docker compose --profile app up -d    # + API and web app containers (make image image-webapp first)
#
# URLs : MLflow http://localhost:5000 · S3 API http://localhost:8333 (no web page)
#        S3 file browser http://localhost:8888/buckets/ · SeaweedFS status http://localhost:9333
#        API http://localhost:8000/docs · Web app http://localhost:8501
#        Prometheus http://localhost:9090 · Grafana http://localhost:3000 (admin / admin)
#
# Monitoring only (no S3, no MLflow needed): docker compose up -d prometheus grafana   (make monitoring)

name: ride-classifier

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-mlops}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-mlops-secret}
  AWS_DEFAULT_REGION: us-east-1
  MLFLOW_S3_ENDPOINT_URL: http://s3:8333

services:
  # S3 storage - remote DVC & MLflow artifact store
  s3:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-latest}
    # The S3 API and the filer must use different ports: the filer listens on 8888 by default.
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=20
    ports:
      - "8333:8333"   # S3 API (DVC, MLflow, boto3): signed requests only, no web page
      - "8888:8888"   # filer: browse files in a browser at /buckets/
      - "9333:9333"   # master: cluster status page
    volumes:
      - s3-data:/data
      - ./infra/s3/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  # Creates buckets "mlflow" & "dvc" at first start, then stops
  s3-init:
    build: ./docker/mlflow
    image: ride-classifier-mlflow:3.18.0
    entrypoint: ["python", "/scripts/create_buckets.py"]
    environment:
      <<: *s3-env
      BUCKETS: mlflow,dvc
    volumes:
      - ./infra/s3/create_buckets.py:/scripts/create_buckets.py:ro
    depends_on:
      - s3
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Tracking + Model Registry. Artifacts flow through the server (--serve-artifacts) so clients don't need s3 creds
  # --workers 1: the default (4) takes ~2.4 GB, too much for the 4 GB Docker VM of an 8 GB laptop
  mlflow:
    build: ./docker/mlflow
    image: ride-classifier-mlflow:3.18.0
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --workers 1
      --backend-store-uri postgresql+psycopg://mlflow:mlflow@postgres:5432/mlflow
      --artifacts-destination s3://mlflow
      --serve-artifacts
      --allowed-hosts "localhost,localhost:*,127.0.0.1:*,mlflow:*,host.docker.internal:*,*.app.github.dev"
    environment:
      <<: *s3-env
      MLFLOW_DISABLE_AGENT_HINT: "1"
      # No GenAI job queue (~8 huey worker processes, ~1.7 GB): tracking + registry don't use it
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"   # macOS: AirPlay Receiver squats 5000 -> set MLFLOW_PORT=5001 in .env
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Containerized API. Model is in the image:
  #   make image   (= export @staging + docker build)
  api:
    profiles: ["app"]
    image: ${DOCKERHUB_USER:-local}/ride-classifier-api:latest
    environment:
      PREDICTION_LOG_PATH: /app/logs/predictions.jsonl
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  webapp:
    profiles: ["app"]
    image: ${DOCKERHUB_USER:-local}/ride-classifier-webapp:latest
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

  # Monitoring: same config files as the Kubernetes prod (infra/monitoring/)
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway" # to scrape an API started on the host (make api)
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ride-classifier.json
    ports:
      - "3000:3000"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  s3-data:
  pg-data:
  prom-data:
  grafana-data:

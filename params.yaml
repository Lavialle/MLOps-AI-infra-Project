# Parameters tracked by DVC (dvc.yaml) and logged to MLflow.
data:
  raw_rides_path: data/raw/GBG500.parquet        # versioned with `dvc add`
  raw_labels_path: data/raw/GBG500_labels.csv    # versioned with `dvc add`
  max_missing_share: 0.05                        # sensor dropouts: interpolated if below, ride rejected above
  test_share: 0.15                              # stratified split BY RIDE, see ride_classifier/data.py
  val_share: 0.15
  random_state: 42
  train_path: data/processed/train.parquet
  val_path: data/processed/val.parquet
  test_path: data/processed/test.parquet         # frozen set used by the evaluation gate

features:
  window_size: 256      # samples per window (25.6 s at 10 Hz)
  window_stride: 128

train:
  model: cnn1d
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  dropout: 0.3
  class_weighting: balanced   # 416 Safe vs 6 Reckless: weight the loss by inverse class frequency
  patience: 8                 # early stopping on validation ride-level macro F1
  random_state: 42

gate:
  cv_folds: 5             # stratified k-fold BY RIDE (ride_classifier.cross_validate): every ride tested once
  min_cv_macro_f1: 0.25   # floor on the CV mean: measured 0.32-0.37 (GPU, CPU), minus ~2 standard errors (std / sqrt 5)
  # also required: beat the majority baseline in EVERY fold, and on the frozen test split for the version promoted

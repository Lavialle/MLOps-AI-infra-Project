# Prediction API: the model is baked into the image (tag set in kustomization.yaml).
# Exposed on http://localhost:8080 through NodePort 30080 (k8s/kind-config.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ride-classifier-api
  labels: {app: ride-classifier-api}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # zero downtime: a new pod must be Ready before an old one is removed
      maxSurge: 1
  selector:
    matchLabels: {app: ride-classifier-api}
  template:
    metadata:
      labels: {app: ride-classifier-api}
      annotations: # scraped by Prometheus (step 9)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics/
    spec:
      containers:
        - name: api
          image: nicogil7/ride-classifier-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # torch would start one thread per node core inside a 1-CPU limit: measured throttling -45 %
          # (ai-infrastructure/optimization/README.md). Keep equal to limits.cpu.
          env:
            - name: OMP_NUM_THREADS
              value: "1"
          # readiness: traffic only once the model is loaded (/ready = 503 before).
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          # liveness: restart only if the process stops answering. A restart is expensive (model reload),
          # so it starts later and tolerates more failures than readiness.
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          # Measured: ~550 MiB RSS with the model loaded (docker stats), p95 340 ms at 16 rides/s on one process.
          # Memory above the limit -> OOMKilled; CPU above the limit -> throttled (slower, not killed).
          resources:
            requests: {cpu: 250m, memory: 640Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: ride-classifier-api
spec:
  type: NodePort
  selector: {app: ride-classifier-api}
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080

# Production environment on Kubernetes: everything in namespace ride-classifier.
#   make k8s-deploy          (= kubectl apply -k k8s/ + wait for rollouts)
#
# Image tags are set HERE only. The CD pipeline (step 8) bumps them with:
#   cd k8s && kustomize edit set image nicogil7/ride-classifier-api=nicogil7/ride-classifier-api:<sha>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ride-classifier

resources:
  - namespace.yaml
  - s3.yaml
  - postgres.yaml
  - mlflow.yaml
  - api.yaml
  - webapp.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: ride-classifier
    includeSelectors: false

# Credentials: k8s/secrets/ is git-ignored (cp k8s/secrets.example/* k8s/secrets/, done by make k8s-secrets)
secretGenerator:
  - name: ride-classifier-secrets
    envs:
      - secrets/secrets.env
  - name: s3-config
    files:
      - s3.json=secrets/s3.json

configMapGenerator:
  - name: ride-classifier-config
    literals:
      - S3_ENDPOINT_URL=http://s3:8333
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_BUCKET=mlflow
      - DVC_BUCKET=dvc

images:
  - name: nicogil7/ride-classifier-api
    newTag: latest
  - name: nicogil7/ride-classifier-webapp
    newTag: latest
  - name: ride-classifier-mlflow
    newTag: "3.18.0"

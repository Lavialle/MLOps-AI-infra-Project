# Prometheus in the docker compose dev stack (docker compose up -d prometheus grafana).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The API wherever it runs in dev: compose container ("api", make app) or uvicorn on the host (make api).
  - job_name: ride-classifier-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
        labels: {env: compose}
      - targets: ["host.docker.internal:8000"]
        labels: {env: host}

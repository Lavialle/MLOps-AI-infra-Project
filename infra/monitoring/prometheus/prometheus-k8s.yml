# Prometheus in the Kubernetes "prod" cluster.
# Service discovery: every pod of the namespace annotated prometheus.io/scrape="true" is scraped
# individually (one series per API replica), on the port and path of its annotations (see k8s/api.yaml).
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels: {env: kind}

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ride-classifier-api
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [ride-classifier]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: ride-classifier-api
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        target_label: __address__
        regex: (.+);(.+)
        replacement: $1:$2
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_image]
        target_label: image

# Reproducible pipeline:  dvc repro  then  dvc push
# DVC only reruns the stages whose dependencies or parameters changed.
#
# The raw files are NOT produced by a stage: they are versioned with
# `dvc add data/raw/GBG500.parquet data/raw/GBG500_labels.csv` (`dvc pull` to get them).
# train and evaluate need the MLflow server (make up) and MLFLOW_TRACKING_URI (make loads .env).
stages:
  split:
    cmd: python -m ride_classifier.data
    deps:
      - src/ride_classifier/data.py
      - data/raw/GBG500.parquet
      - data/raw/GBG500_labels.csv
    params:
      - data
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet

  train:
    cmd: python -m ride_classifier.train
    deps:
      - src/ride_classifier/train.py
      - src/ride_classifier/model.py
      - src/ride_classifier/features.py
      - data/processed/train.parquet
      - data/processed/val.parquet
    params:
      - features
      - train
    metrics:
      - reports/train.json:
          cache: false

  cv:
    cmd: python -m ride_classifier.cross_validate
    deps:
      - src/ride_classifier/cross_validate.py
      - src/ride_classifier/train.py
      - src/ride_classifier/model.py
      - src/ride_classifier/features.py
      - src/ride_classifier/data.py
      - data/raw/GBG500.parquet
      - data/raw/GBG500_labels.csv
    params:
      - data
      - features
      - train
      - gate.cv_folds
    metrics:
      - reports/cv.json:
          cache: false

  evaluate:
    cmd: python -m ride_classifier.evaluate
    deps:
      - src/ride_classifier/evaluate.py
      - reports/train.json
      - reports/cv.json
      - data/processed/test.parquet
    params:
      - gate
    metrics:
      - reports/eval.json:
          cache: false
